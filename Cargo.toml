[workspace]
resolver = "2"
members = [
    "packages/core-engine",
    "apps/server",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"

[profile.release]
opt-level = 2
debug = false
